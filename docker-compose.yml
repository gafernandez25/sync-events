services:
  webserver:
    container_name: events-nginx
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - "806:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./public:/application/public

  php-fpm:
    container_name: events-php-fpm
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
      target: development
    volumes:
      - .:/application
    working_dir: /application
    environment:
      XDEBUG_MODE: 'debug,develop'
      PHP_IDE_CONFIG: 'serverName=events'
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway

  db:
      container_name: events-db
      image: mysql:8.0.30
      restart: unless-stopped
      volumes:
          - mysql_data:/var/lib/mysql
      environment:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_USER: user
          MYSQL_PASSWORD: 1234
          MYSQL_DATABASE: main_db
      ports:
          - "33066:3306"
  test-db:
      container_name: events-test-db
      image: mysql:8.0.30
      restart: unless-stopped
      environment:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_USER: user
          MYSQL_PASSWORD: 1234
          MYSQL_DATABASE: test_db
      ports:
          - "33166:3306"
  phpmyadmin:
      depends_on:
          - db
          - test-db
      container_name: events-phpmyadmin
      image: phpmyadmin/phpmyadmin
      ports:
          - "8006:80"
      restart: unless-stopped
      environment:
          - PMA_ARBITRARY=1
          - UPLOAD_LIMIT=300000000
          - MYSQL_ROOT_PASSWORD=1234
          - PMA_HOST=db

volumes:
    mysql_data:
